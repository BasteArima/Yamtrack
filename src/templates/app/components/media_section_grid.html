{% load app_tags %}

<section class="space-y-5">
  {% include "app/components/media_status_header.html" with status=section.status count=section.total %}

  <div id="grid-{{ section.id }}" class="media-grid">
    {% include "app/components/media_grid_items.html" with media_list=section.items %}
  </div>

  {% if section.total > section_item_limit %}
    <div class="flex justify-center">
      <button type="button"
              hx-get="{% url 'medialist' target_user.username media_type %}?load_section={{ section.status|urlencode }}&sort={{ current_sort }}&search={{ request.GET.search|default:''|urlencode }}&layout={{ current_layout }}"
              hx-target="#grid-{{ section.id }}"
              hx-swap="innerHTML"
              hx-indicator="#loading-indicator"
              hx-on:click="this.remove()"
              class="rounded-md border border-gray-700 bg-[#2a2f35] px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-[#313842] cursor-pointer">
        Load all ({{ section.total }})
      </button>
    </div>
  {% endif %}
</section>
